# Environment configuration for HealthyLifestyleEnv.
# All values are configurable; the safety layer reads the `safety` block.

env:
  episode_days: 60            # 30 quick / 60 medium / 90 final eval
  seed: 0
  default_profile: "general_wellness"

safety:
  min_calorie_target: 1500
  max_calorie_target: 3500
  max_daily_calorie_change: 150     # kcal per day
  min_sleep_target_h: 6.5
  max_sleep_target_h: 9.5
  max_step_increase_per_day: 1500   # steps
  min_recovery_threshold: 0.35      # 0-1
  min_protein_g_per_kg: 1.2
  max_protein_g_per_kg: 2.4

rewards:
  goal_progress: 1.0
  adherence: 0.8
  sleep: 0.6
  activity: 0.5
  recovery: 0.7
  unsafe_action_penalty: 1.5
  rapid_change_penalty: 0.6
  instability_penalty: 0.4
