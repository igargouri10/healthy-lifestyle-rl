# DQN training configuration.
dqn:
  total_episodes: 250
  hidden_sizes: [128, 128]
  gamma: 0.99
  learning_rate: 0.0005
  batch_size: 64
  buffer_size: 50000
  min_replay_size: 1000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 200
  target_update_freq: 500     # in env steps
  train_freq: 4               # gradient step every N env steps
  grad_clip: 10.0
  device: "cpu"
  log_every: 10
  save_path: "results/trained_models/dqn_model.pt"
  metrics_path: "results/metrics/dqn_training_metrics.csv"
  plot_path: "results/plots/dqn_training_curve.png"
