# PPO (Stable-Baselines3) training configuration.
ppo:
  total_timesteps: 30000
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  learning_rate: 0.0003
  policy: "MlpPolicy"
  seed: 0
  verbose: 0
  save_path: "results/trained_models/ppo_model.zip"
  metrics_path: "results/metrics/ppo_training_metrics.csv"
  plot_path: "results/plots/ppo_training_curve.png"
